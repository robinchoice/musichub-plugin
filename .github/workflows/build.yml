name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            archive: MusicHub-macOS.zip
          - name: Windows
            os: windows-2025
            archive: MusicHub-Windows.zip
          - name: Linux
            os: ubuntu-24.04
            archive: MusicHub-Linux.tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libxfixes-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Unsigned builds: macOS needs the quarantine flag removed, and AAX only
      # loads in Pro Tools Developer until the bundles are signed with PACE.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/MusicHub
          cp -R build/MusicHub_artefacts/Release/{VST3,AU,AAX,Standalone} dist/MusicHub/
          ditto -c -k --keepParent dist/MusicHub "${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist/MusicHub | Out-Null
          Copy-Item -Recurse -Path build/MusicHub_artefacts/Release/VST3, build/MusicHub_artefacts/Release/AAX, build/MusicHub_artefacts/Release/Standalone -Destination dist/MusicHub
          # Import libraries and export files from linking aren't part of the plugin
          Get-ChildItem dist/MusicHub -Recurse -Include *.lib, *.exp | Remove-Item
          Compress-Archive -Path dist/MusicHub -DestinationPath "${{ matrix.archive }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/MusicHub
          cp -R build/MusicHub_artefacts/Release/{VST3,Standalone} dist/MusicHub/
          tar -C dist -czf "${{ matrix.archive }}" MusicHub

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The annotated tag carries the release notes; checkout may leave only a
      # lightweight tag pointing at the commit.
      - name: Fetch tag
        run: git fetch --depth=1 --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Music Hub Plugin $GITHUB_REF_NAME" --prerelease "${notes[@]}"
